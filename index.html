<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://kit.fontawesome.com/7cf0d8bdc4.js" crossorigin="anonymous"></script>
</head>

<body>
    <div id="imageViewer" class="image-viewer">
        <button id="closeBtn">✕</button>
        <img id="viewerImg" src="" alt="selected image">
        <span>
            <button id="prev">⟪</button>
            <button id="next">⟫</button>
        </span>
    </div>
    <div class="container">
        <aside>
            <header>
                <h2>Images</h2>
                <div class="filterBtn">
                    <p>filter</p>
                    <button>All</button>
                    <button>Nature</button>
                    <button>Animals</button>
                    <button>Trees</button>
                    <button>Computer</button>
                    <button>Robot</button>

                </div>
            </header>
        </aside>
        <div class="hero-container">
            <h2>Image Gallery</h2>
            <div class="info">
                <p>Beautiful, modern image gallery work, designs, illustrations, and graphic elements</p>
                <div class="search-container">
                    <button for="search"><i class="fa-solid fa-magnifying-glass"></i></button>
                    <input type="search" placeholder="search for images...">
                </div>
                <div class="mobileFilter">
                    <button>All</button>
                    <button>Nature</button>
                    <button>Animals</button>
                    <button>Trees</button>
                    <button>Computer</button>
                    <button>Robot</button>
                </div>
            </div>
            <div class="gallery">
                <div class="images">
                    <img id="image" src="AMIJ5608 (1).JPG" alt="beautiful tree" data-category="Nature">
                </div>
                <div class="images">
                    <img id="image" src="CWTW4407.JPG" alt="deer photo" data-category="Animals">
                </div>
                <div class="images">
                    <img id="image" src="CXYT9946.JPG" alt=" Ntech" data-category="Computer">
                </div>
                <div class="images">
                    <img id="image" src="IMG_3542.JPG" alt="Fox" data-category="Animals">
                </div>
                <div class="images">
                    <img id="image" src="IMG_3543.JPG" alt="Cat" data-category="Animals">
                </div>
                <div class="images">
                    <img id="image" src="IMG_3544.JPG" alt="Racoon" data-category="Animals">
                </div>
                <div class="images">
                    <img id="image" src="IMG_3545.JPG" alt="code" data-category="Computer">
                </div>
                <div class="images">
                    <img id="image" src="IMG_3546.JPG" alt="code" data-category="Computer">
                </div>
                <div class="images">
                    <img id="image" src="IMG_3547.JPG" alt="work setup" data-category="Computer">
                </div>
                <div class="images">
                    <img id="image" src="IMG_3549.JPG" alt="glass high rise" data-category="Building">
                </div>
                <div class="images">
                    <img id="image" src="IMG_3550.JPG" alt="Glass building" data-category="Building">
                </div>
                <div class="images">
                    <img id="image" src="IMG_3551.JPG" alt="single high rise" data-category="Building">
                </div>
                <div class="images">
                    <img id="image" src="IMG_3552.JPG" alt="city view" data-category="Building">
                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
